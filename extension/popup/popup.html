<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Eng2Kor Flow</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --bg: #ffffff; --line: #e5e5ea; --accent: #2f6fed; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f5f5f7; --muted: #a1a1a6; --bg: #1c1c1e; --line: #38383a; --accent: #5b8cff; }
  }
  body { margin: 0; width: 280px; font: 13px/1.5 system-ui, "Malgun Gothic", sans-serif; color: var(--fg); background: var(--bg); }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; margin: 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .muted { color: var(--muted); font-size: 12px; }
  h2 { margin: 0; padding: 10px 16px 4px; font-size: 12px; font-weight: 600; color: var(--muted); border-top: 1px solid var(--line); }
  ul { list-style: none; margin: 0; padding: 0 16px 12px; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
  button { font: inherit; color: var(--accent); background: none; border: 0; cursor: pointer; padding: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header>Eng2Kor Flow</header>
  <label class="row"><span>자동 변환</span><input type="checkbox" id="enabled"></label>
  <label class="row"><span>변환 미리보기<br><span class="muted">치는 동안 바뀔 글자를 보여 줘요</span></span><input type="checkbox" id="preview"></label>
  <label class="row" id="site-row">
    <span><span id="site-host"></span><br><span class="muted">이 사이트에서 사용</span></span>
    <input type="checkbox" id="site">
  </label>
  <p class="row muted" id="site-unavailable" hidden>이 페이지에서는 동작하지 않아요. 방금 설치했다면 페이지를 새로고침해 주세요.</p>
  <h2 id="disabled-title" hidden>꺼 둔 사이트</h2>
  <ul id="disabled-list"></ul>
  <script src="popup.js"></script>
</body>
</html>
