<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 스토어 마키 이미지: node scripts/screenshot.mjs store/marquee.html 1400 560 store/marquee-1400x560.png -->
<style>
  html, body { margin: 0; width: 1400px; height: 560px; overflow: hidden; }
  body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: linear-gradient(135deg, #2f6fed, #5b8cff); color: #fff; display: grid; grid-template-columns: auto auto; justify-content: center; align-items: center; gap: 96px; }
  .brand { display: grid; gap: 18px; }
  .logo { width: 120px; height: 120px; border-radius: 30px; background: #fff; color: #2f6fed; font-size: 78px; font-weight: 700; display: grid; place-items: center; }
  h1 { margin: 8px 0 0; font-size: 64px; letter-spacing: -1px; }
  p { margin: 0; font-size: 30px; opacity: .92; }
  .demo { display: grid; gap: 18px; justify-items: center; }
  .pill { min-width: 420px; padding: 22px 36px; border-radius: 20px; font-size: 40px; text-align: center; }
  .from { background: rgba(255, 255, 255, .16); font-family: Consolas, monospace; }
  .to { background: #fff; color: #1d1d1f; font-weight: 700; box-shadow: 0 16px 40px rgba(10, 30, 90, .25); }
  .arrow { font-size: 40px; opacity: .9; }
</style>
</head>
<body>
  <div class="brand">
    <div class="logo">가</div>
    <h1>Eng2Kor Flow</h1>
    <p>한/영 키를 깜빡해도 한글로</p>
  </div>
  <div class="demo">
    <div class="pill from">dkssudgktpdy</div>
    <div class="arrow">↓</div>
    <div class="pill to">안녕하세요</div>
  </div>
</body>
</html>
