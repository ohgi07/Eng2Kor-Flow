<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1280px; height: 800px; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: #f5f7fb; color: #1d1d1f; display: grid; grid-template-columns: 1fr 1fr; align-items: center; padding: 0 96px; gap: 64px; }
  h1 { font-size: 52px; line-height: 1.25; margin: 0 0 24px; }
  h1 em { font-style: normal; color: #2f6fed; }
  ul { list-style: none; padding: 0; margin: 0; font-size: 22px; line-height: 1.9; color: #3a3a3c; }
  li::before { content: "✓ "; color: #2f6fed; font-weight: 700; }
  .card { background: #fff; border-radius: 20px; box-shadow: 0 12px 40px rgba(20, 40, 90, .12); padding: 36px; display: grid; gap: 18px; }
  .ex { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; font-size: 26px; }
  .from { font-family: Consolas, monospace; color: #8e8e93; }
  .arrow { color: #2f6fed; font-weight: 700; }
  .to { font-weight: 700; }
  .note { font-size: 16px; color: #8e8e93; }
</style>
</head>
<body>
  <div>
    <h1>한/영 키를 깜빡해도<br><em>한글로</em> 바로잡아요</h1>
    <ul>
      <li>입력하는 도중 자동 변환</li>
      <li>영어 단어는 그대로</li>
      <li>잘못 바뀌면 백스페이스로 되돌리기</li>
      <li>비밀번호 칸은 건드리지 않아요</li>
      <li>입력 내용은 저장·전송하지 않아요</li>
    </ul>
  </div>
  <div class="card">
    <div class="ex"><span class="from">dkssudgktpdy</span><span class="arrow">→</span><span class="to">안녕하세요</span></div>
    <div class="ex"><span class="from">dho go</span><span class="arrow">→</span><span class="to">왜 해</span></div>
    <div class="ex"><span class="from">rmfozzz</span><span class="arrow">→</span><span class="to">그래ㅋㅋㅋ</span></div>
    <div class="ex"><span class="from">aldksbb</span><span class="arrow">→</span><span class="to">미안ㅠㅠ</span></div>
    <div class="ex"><span class="from">hello world</span><span class="arrow">→</span><span class="to">hello world</span></div>
    <div class="note">스페이스·Enter·문장부호를 누르는 순간 바뀝니다</div>
  </div>
</body>
</html>
